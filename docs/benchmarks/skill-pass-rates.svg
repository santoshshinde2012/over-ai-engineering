<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" role="img" aria-labelledby="title desc">
  <title id="title">Published skill pass rates, with and without a skill</title>
  <desc id="desc">SkillsBench hard tasks rise from 33.9 percent to 50.5 percent. SWE-Skills-Bench public skills stay at 76.59 percent and 76.93 percent. These are the papers' results, not a run of this repository.</desc>
  <rect width="880" height="360" fill="#fafaf9"/>
  <text x="32" y="36" fill="#1c1917" font-family="Georgia, serif" font-size="20">Published pass rates. This repository did not run these studies.</text>
  <g transform="translate(32,64)">
    <text x="0" y="0" fill="#1c1917" font-family="Georgia, serif" font-size="16">Hard tasks</text>
    <text x="0" y="22" fill="#57534e" font-family="Georgia, serif" font-size="13">SkillsBench, 87 tasks, 18 setups</text>
    <line x1="36" y1="48" x2="36" y2="210" stroke="#d6d3d1"/>
    <line x1="36" y1="210" x2="360" y2="210" stroke="#d6d3d1"/>
    <rect x="90" y="155" width="56" height="55" fill="#a8a29e"/>
    <rect x="190" y="128" width="56" height="82" fill="#1f883d"/>
    <text x="118" y="148" text-anchor="middle" fill="#1c1917" font-family="Georgia, serif" font-size="13">33.9%</text>
    <text x="218" y="120" text-anchor="middle" fill="#1c1917" font-family="Georgia, serif" font-size="13">50.5%</text>
    <text x="118" y="230" text-anchor="middle" fill="#57534e" font-family="Georgia, serif" font-size="13">Without</text>
    <text x="218" y="230" text-anchor="middle" fill="#57534e" font-family="Georgia, serif" font-size="13">With</text>
  </g>
  <g transform="translate(460,64)">
    <text x="0" y="0" fill="#1c1917" font-family="Georgia, serif" font-size="16">Public software skills</text>
    <text x="0" y="22" fill="#57534e" font-family="Georgia, serif" font-size="13">SWE-Skills-Bench, 98 skills</text>
    <line x1="36" y1="48" x2="36" y2="210" stroke="#d6d3d1"/>
    <line x1="36" y1="210" x2="360" y2="210" stroke="#d6d3d1"/>
    <rect x="90" y="86" width="56" height="124" fill="#a8a29e"/>
    <rect x="190" y="85" width="56" height="125" fill="#1f883d"/>
    <text x="118" y="78" text-anchor="middle" fill="#1c1917" font-family="Georgia, serif" font-size="13">76.59%</text>
    <text x="218" y="76" text-anchor="middle" fill="#1c1917" font-family="Georgia, serif" font-size="13">76.93%</text>
    <text x="118" y="230" text-anchor="middle" fill="#57534e" font-family="Georgia, serif" font-size="13">Without</text>
    <text x="218" y="230" text-anchor="middle" fill="#57534e" font-family="Georgia, serif" font-size="13">With</text>
  </g>
  <text x="32" y="332" fill="#57534e" font-family="Georgia, serif" font-size="13">Scale is 0 to 100. The right-hand pair is almost the same height on purpose.</text>
</svg>
