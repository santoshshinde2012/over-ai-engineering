<svg xmlns="http://www.w3.org/2000/svg" width="880" height="414" viewBox="0 0 880 414" role="img" aria-labelledby="title desc">
  <title id="title">Published skill results, measured within each study</title>
  <desc id="desc">Two separate paired comparisons, with different scores and samples. SkillsBench task pass rate rises from 33.9 to 50.5 percent, a gain of 16.6 percentage points. SWE-Skills-Bench average share of executable checks passed moves from 76.59 to 76.93 percent, a gain of 0.34 percentage points. Each requirement contributes equally to the latter average. These are published results, not runs of this repository. There is no shared chart scale.</desc>
  <rect width="880" height="414" fill="#fafaf9"/>
  <text x="32" y="36" fill="#1c1917" font-family="Georgia, serif" font-size="20">Published skill results. This repository did not run these studies.</text>
  <text x="32" y="61" fill="#57534e" font-family="Georgia, serif" font-size="13">Different scores and samples. Compare With and Without inside each study.</text>
  <g transform="translate(32,88)">
    <rect width="396" height="262" rx="8" fill="#ffffff" stroke="#d6d3d1"/>
    <text x="24" y="31" fill="#1c1917" font-family="Georgia, serif" font-size="17">SkillsBench</text>
    <text x="24" y="55" fill="#57534e" font-family="Georgia, serif" font-size="13">87 tasks · 18 model and harness setups</text>
    <text x="24" y="94" fill="#1c1917" font-family="Georgia, serif" font-size="15">Task pass rate</text>
    <text x="24" y="139" fill="#57534e" font-family="Georgia, serif" font-size="32">33.9%</text>
    <text x="174" y="136" fill="#a8a29e" font-family="Georgia, serif" font-size="24">→</text>
    <text x="232" y="139" fill="#1f883d" font-family="Georgia, serif" font-size="32">50.5%</text>
    <text x="24" y="162" fill="#57534e" font-family="Georgia, serif" font-size="13">Without skills</text>
    <text x="232" y="162" fill="#57534e" font-family="Georgia, serif" font-size="13">With skills</text>
    <line x1="24" y1="183" x2="372" y2="183" stroke="#d6d3d1"/>
    <text x="24" y="209" fill="#1f883d" font-family="Georgia, serif" font-size="16">+16.6 percentage points</text>
    <text x="24" y="236" fill="#57534e" font-family="Georgia, serif" font-size="13">Curated skills · agent discovers the skill</text>
  </g>
  <g transform="translate(452,88)">
    <rect width="396" height="262" rx="8" fill="#ffffff" stroke="#d6d3d1"/>
    <text x="24" y="31" fill="#1c1917" font-family="Georgia, serif" font-size="17">SWE-Skills-Bench</text>
    <text x="24" y="55" fill="#57534e" font-family="Georgia, serif" font-size="13">98 skills · 10 requirements each · 4 setups</text>
    <text x="24" y="94" fill="#1c1917" font-family="Georgia, serif" font-size="15">Average share of checks passed</text>
    <text x="24" y="139" fill="#57534e" font-family="Georgia, serif" font-size="32">76.59%</text>
    <text x="174" y="136" fill="#a8a29e" font-family="Georgia, serif" font-size="24">→</text>
    <text x="232" y="139" fill="#1f883d" font-family="Georgia, serif" font-size="32">76.93%</text>
    <text x="24" y="162" fill="#57534e" font-family="Georgia, serif" font-size="13">Without skill</text>
    <text x="232" y="162" fill="#57534e" font-family="Georgia, serif" font-size="13">With skill</text>
    <line x1="24" y1="183" x2="372" y2="183" stroke="#d6d3d1"/>
    <text x="24" y="209" fill="#1f883d" font-family="Georgia, serif" font-size="16">+0.34 percentage points</text>
    <text x="24" y="236" fill="#57534e" font-family="Georgia, serif" font-size="13">Public skills · skill invoked explicitly</text>
  </g>
  <text x="32" y="379" fill="#57534e" font-family="Georgia, serif" font-size="13">SWE averages requirement-level check fractions equally. These percentages are not the same measure.</text>
  <text x="32" y="400" fill="#57534e" font-family="Georgia, serif" font-size="13">Source selection differs too. Neither paper measures a skill in your repository.</text>
</svg>
